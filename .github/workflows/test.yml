name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check plugin tests
      - name: Installer moonraker fixtures
        run: bash tests/test_install_moonraker.sh
      - name: Installer extras symlink
        run: bash tests/test_install_extras.sh
      - name: Run tests
        run: pytest tests/ -q

# Purge at pose — comment/uncomment template
# docs/features/purge_at_pose.md
# Requires [klipper_extras]. Registers PURGE_AT_POSE
# (listed on Mainsail / Fluidd as gcode_macro PURGE_AT_POSE).
#
# start_x, start_y, purge_z are required (your chute / bucket / park).
# Purge only — call WIPE_NOZZLE_ON_RUBBER afterwards if needed.
# While paused: XY at current Z (no hop / purge_z / lift). Heat still runs.
# travel_speed omitted: [printer] max_velocity (set the key to override).

[klipper_extras purge_at_pose]
start_x: 0
start_y: 0
purge_z: 2

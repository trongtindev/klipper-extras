# Pause / resume / cancel — comment/uncomment template
# docs/features/pause_resume.md
# Requires [klipper_extras] and Klipper extras:
#   [virtual_sdcard]
#   [pause_resume]
#   [respond]
# Registers PAUSE, RESUME, CANCEL_PRINT at klippy:ready (after UI macros).
# At connect, adds gcode_macro PAUSE / RESUME / CANCEL_PRINT printer objects
# (handlers stay on register_command).
# Put [virtual_sdcard] / [pause_resume] / [respond] in printer.cfg (config
# error if missing). MainsailOS includes mainsail.cfg by default — remove
# that include (it registers PAUSE / RESUME / CANCEL_PRINT).
#
# Omitted park_x/park_y → retract + Z-hop in place (no XY).

[klipper_extras pause_resume]
# park_x: 10
# park_y: 10
# z_hop: 5
# travel_speed: 100
# z_speed: 15
# retract: 1
# retract_speed: 35
# unretract: 1
# unretract_speed: 35
# cancel_retract: 5
# park_at_cancel: False
# cancel_park_x: 10
# cancel_park_y: 10
# idle_timeout: 0
# restore_temperature: True
# runout_sensor: filament_switch_sensor runout
#before_pause_gcode:
#after_pause_gcode:
#before_resume_gcode:
#after_resume_gcode:
#before_cancel_gcode:
#after_cancel_gcode:
# on_hook_fail: stop
